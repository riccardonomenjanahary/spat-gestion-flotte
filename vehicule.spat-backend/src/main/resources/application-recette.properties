# Profil strictement local : lancer avec scripts/recette/start-backend.ps1.
# L'URL de la base séparée est imposée par le lanceur, jamais reprise telle quelle.
server.address=0.0.0.0
server.port=18080
spring.jpa.show-sql=false
gps.enabled=false
gps.initial-delay-ms=86400000
app.notifications.email.enabled=true
spring.mail.host=127.0.0.1
spring.mail.port=2525
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
app.mail.from=Recette GPA <recette@example.invalid>
app.frontend.url=http://localhost:13000
app.uploads.dir=./.recette/uploads
