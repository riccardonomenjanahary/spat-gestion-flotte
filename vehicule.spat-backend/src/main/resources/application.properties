spring.application.name=vehicule.spat-backend


# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=${SPAT_DB_URL}
spring.datasource.username=${SPAT_DB_USERNAME}
spring.datasource.password=${SPAT_DB_PASSWORD}


# =========================================================
# HIBERNATE / JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Les bases déjà utilisées sont prises comme schéma de référence V1.
# Toute évolution future doit être ajoutée dans db/migration (V2, V3, ...).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema existant SPAT
spring.flyway.validate-on-migrate=true


# =========================================================
# JWT SECURITY
# =========================================================

jwt.secret=${SPAT_JWT_SECRET}


# =========================================================
# EMAIL SMTP - GMAIL
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=465

spring.mail.username=${SPAT_MAIL_USERNAME}
spring.mail.password=${SPAT_MAIL_PASSWORD:}

# Authentification SMTP
spring.mail.properties.mail.smtp.auth=true

# Gmail port 465 = SSL implicite ; ne pas activer STARTTLS en parallèle.
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# SSL implicite sur le port 465.
spring.mail.properties.mail.smtp.ssl.enable=true

# Vérifier le certificat et le nom du serveur SMTP avec le magasin Java standard.
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Encodage
spring.mail.default-encoding=UTF-8

# Expéditeur visible
app.mail.from=${SPAT_MAIL_FROM:${SPAT_MAIL_USERNAME}}


# =========================================================
# FRONTEND
# =========================================================

app.frontend.url=${SPAT_FRONTEND_URL}


# =========================================================
# GPS - GPS-GPS.ONLINE
# =========================================================
# BLOC GPS CONSERVE TEL QU'IL FONCTIONNE ACTUELLEMENT
# NE PAS MODIFIER
# =========================================================

gps.enabled=true

gps.base-url=https://gps-gps.online

gps.items-path=/objects/items

gps.items-json-path=/objects/items_json

gps.cookie=${SPAT_GPS_COOKIE:}

gps.xsrf-token=${SPAT_GPS_XSRF_TOKEN:}

gps.refresh-ms=5000

gps.initial-delay-ms=5000

gps.identifier=${SPAT_GPS_IDENTIFIER}
gps.password=${SPAT_GPS_PASSWORD}

# =========================================================
# JUSTIFICATIFS (upload documentaire du dispositif DGAL)
# =========================================================

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

app.uploads.dir=${SPAT_UPLOADS_DIR:./uploads}


# =========================================================
# DISPOSITIF DGAL - HORAIRES ET RÈGLES
# =========================================================
# Horaires de travail (format HH:mm)
app.dispositif.debut-travail=08:00
app.dispositif.fin-travail=18:00
app.dispositif.debut-pause=12:00
app.dispositif.fin-pause=14:00

# Horaires de nuit (interdiction réservation motos)
app.dispositif.debut-nuit=18:00
app.dispositif.fin-nuit=06:00

# Jours fériés (séparés par des virgules, format YYYY-MM-DD)
app.dispositif.jours-feries=
